<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 440" width="490" height="440">
  <style>

    @keyframes lineFadeIn {
      0% {
        opacity: 0;
        transform: translateX(-12px);
      }
      100% {
        opacity: 1;
        transform: translateX(0);
      }
    }
    .line {
      opacity: 0;
      animation: lineFadeIn 0.38s ease-out forwards;
      transform-box: fill-box;
      transform-origin: left center;
    }

    .l-0 { animation-delay: 0.12s; }
    .l-1 { animation-delay: 0.2s; }
    .l-2 { animation-delay: 0.28s; }
    .l-3 { animation-delay: 0.36s; }
    .l-4 { animation-delay: 0.44s; }
    .l-5 { animation-delay: 0.52s; }
    .l-6 { animation-delay: 0.6s; }
    .l-7 { animation-delay: 0.68s; }
    .l-8 { animation-delay: 0.76s; }
    .l-9 { animation-delay: 0.84s; }
    .l-10 { animation-delay: 0.92s; }
    .l-11 { animation-delay: 1.0s; }
    .l-12 { animation-delay: 1.08s; }
    .header-bar-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      fill: #8b949e;
    }
  </style>

  <!-- Terminal Window Container -->
  <rect x="0.5" y="0.5" width="489" height="439" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1" />

