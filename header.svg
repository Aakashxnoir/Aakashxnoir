<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 150" width="860" height="150">
  <style>
    .name { font: 400 64px Georgia, "Times New Roman", serif; letter-spacing: -1px; fill: #1f2328; }
    .sub  { font: 400 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #6e7781; letter-spacing: 0.5px; }
    .rule { stroke: #c98d52; stroke-width: 2; }
    @media (prefers-color-scheme: dark) {
      .name { fill: #e6edf3; }
      .sub  { fill: #7d8590; }
      .rule { stroke: #d9a56b; }
    }
  </style>
  <text x="4" y="78" class="name">Aakash</text>
  <line x1="6" y1="100" x2="62" y2="100" class="rule"/>
  <text x="6" y="130" class="sub">student · developer · builds things that ship</text>
</svg>
